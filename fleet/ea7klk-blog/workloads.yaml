---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "annotations": {
      "deployment.kubernetes.io/revision": "1"
    },
    "name": "ghost",
    "namespace": "ea7klk-blog"
  },
  "spec": {
    "progressDeadlineSeconds": 600,
    "replicas": 1,
    "revisionHistoryLimit": 10,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "ghost"
      }
    },
    "strategy": {
      "type": "Recreate"
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "ghost"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "containers": [
          {
            "args": [
              "node",
              "current/index.js"
            ],
            "command": [
              "docker-entrypoint.sh"
            ],
            "envFrom": [
              {
                "secretRef": {
                  "name": "ghost-env"
                }
              }
            ],
            "image": "ghost@sha256:6e37900accfb12e16fbc15bf94500e09829cb17e6448b3051e9c76446b4fbf53",
            "imagePullPolicy": "IfNotPresent",
            "name": "ghost",
            "ports": [
              {
                "containerPort": 2368,
                "name": "p2368-tcp",
                "protocol": "TCP"
              }
            ],
            "readinessProbe": {
              "failureThreshold": 3,
              "periodSeconds": 10,
              "successThreshold": 1,
              "tcpSocket": {
                "port": 2368
              },
              "timeoutSeconds": 1
            },
            "resources": {
              "requests": {
                "cpu": "25m",
                "memory": "64Mi"
              }
            },
            "startupProbe": {
              "failureThreshold": 180,
              "periodSeconds": 10,
              "successThreshold": 1,
              "tcpSocket": {
                "port": 2368
              },
              "timeoutSeconds": 1
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File",
            "volumeMounts": [
              {
                "mountPath": "/var/lib/ghost/content",
                "name": "v-32b215f50cdd69d6"
              },
              {
                "mountPath": "/dev/shm",
                "name": "shm"
              }
            ],
            "workingDir": "/var/lib/ghost"
          }
        ],
        "dnsPolicy": "ClusterFirst",
        "imagePullSecrets": [
          {
            "name": "registry-credentials"
          }
        ],
        "nodeSelector": {
          "kubernetes.io/hostname": "spainip-k3s"
        },
        "restartPolicy": "Always",
        "schedulerName": "default-scheduler",
        "securityContext": {},
        "terminationGracePeriodSeconds": 120,
        "volumes": [
          {
            "name": "v-32b215f50cdd69d6",
            "persistentVolumeClaim": {
              "claimName": "v-32b215f50cdd69d6"
            }
          },
          {
            "emptyDir": {
              "medium": "Memory",
              "sizeLimit": "67108864"
            },
            "name": "shm"
          }
        ]
      }
    }
  }
}

